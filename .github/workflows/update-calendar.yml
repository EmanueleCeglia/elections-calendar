name: Update elections calendar

on:
  schedule:
    - cron: "17 5 * * 1"  # every Monday, 05:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated subset of sources (empty = all enabled)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[llm]"

      - name: Run pipeline
        env:
          # Optional: without this secret the LLM source is skipped.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          if [ -n "$SOURCES" ]; then
            python -m elections_calendar run --sources "$SOURCES"
          else
            python -m elections_calendar run
          fi

      - name: Commit the updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update elections calendar ($(date -u +%Y-%m-%d))"
            git push
          fi
