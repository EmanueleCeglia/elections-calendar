# EU-27 member states and the constitutional facts the pipeline needs to
# classify elections. This is static reference data about *institutions*,
# not a list of elections: the elections themselves are always fetched.
#
#   wikidata          Wikidata item of the country (used to filter sources)
#   wikidata_aliases  other items Wikidata uses as "country" of elections
#   names             names/demonyms used in titles and free text
#   indirect          election types that are decided by an assembly or
#                     electoral college rather than by voters
#   upper_house       names of the upper chamber, when it can be elected on
#                     its own (partial renewals, indirect elections)
#   concurrent_upper  true when the upper chamber is always elected together
#                     with the lower one (so "Senate" never stands alone)
#   not_elected       bodies whose members are delegated, not elected in a
#                     distinct election (dropped when a source lists them)

